<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="last-word.js" defer></script>
</head>
<body>
    <div class="container">
        <h1 style="text-decoration:underline">Last word</h1>
        <div style="display: flex; flex-direction:column; width:25%; gap:1rem" >

        </div>
    </div>
    
</body>
